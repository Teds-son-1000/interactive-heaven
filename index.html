<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interactive Heaven</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:Georgia,'Times New Roman',serif}
#sky{position:fixed;inset:0;background:linear-gradient(180deg,#1a2340 0%,#3b4a7a 30%,#9a8fc7 55%,#ffd9a8 75%,#fff3d6 100%);transition:background 3s;overflow:hidden;cursor:pointer}
#sky.day{background:linear-gradient(180deg,#3fa7ff 0%,#8fd0ff 35%,#cdeaff 60%,#fff6d8 85%,#fffbe9 100%)}
#sun{position:absolute;top:12%;left:50%;width:90px;height:90px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#fffbe0 0%,#ffedb0 40%,rgba(255,220,130,.4) 65%,transparent 75%);box-shadow:0 0 60px 25px rgba(255,240,190,.55);opacity:.55;transition:opacity 3s;pointer-events:none}
#sky.day #sun{opacity:1}
.cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:50px;filter:blur(1px);opacity:.8;pointer-events:none;animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:inherit;border-radius:50%}
.star{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.8);cursor:pointer;transition:transform .25s,box-shadow .25s;animation:twinkle 2.5s ease-in-out infinite}
.star::after{content:'';position:absolute;inset:-12px;cursor:pointer}
.star.glow{transform:scale(3);box-shadow:0 0 25px 10px rgba(255,240,180,.95)}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,230,160,.35) 60%,transparent 75%);pointer-events:none;animation:floatUp linear infinite}
@keyframes floatUp{from{transform:translateY(110vh);opacity:0}10%{opacity:.9}90%{opacity:.7}to{transform:translateY(-15vh);opacity:0}}
.shoot{position:absolute;width:120px;height:3px;border-radius:3px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(-25deg);pointer-events:none;animation:shoot 1.4s ease-out forwards}
@keyframes shoot{from{opacity:1}to{transform:rotate(-25deg) translateX(-45vw);opacity:0}}
#msg{position:fixed;top:22%;left:50%;transform:translate(-50%,-20px);max-width:88vw;text-align:center;color:#fff;text-shadow:0 2px 18px rgba(90,60,160,.7);font-size:clamp(1.2rem,4.5vw,2rem);font-style:italic;opacity:0;transition:opacity .8s,transform .8s;pointer-events:none;z-index:10}
#msg.show{opacity:1;transform:translate(-50%,0)}
#ui{position:fixed;bottom:0;left:0;right:0;display:flex;gap:10px;justify-content:center;padding:14px 12px calc(14px + env(safe-area-inset-bottom));z-index:20}
button{flex:1;max-width:220px;padding:13px 10px;border:none;border-radius:30px;font-size:1rem;cursor:pointer;background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.4);transition:background .2s}
button:active{background:rgba(255,255,255,.4)}
#hint{position:fixed;top:10px;width:100%;text-align:center;color:rgba(255,255,255,.85);font-size:.85rem;letter-spacing:1px;pointer-events:none;z-index:10}
.ripple{position:absolute;border:2px solid rgba(255,255,255,.7);border-radius:50%;pointer-events:none;animation:rip 1s ease-out forwards}
@keyframes rip{from{width:10px;height:10px;opacity:1;transform:translate(-50%,-50%)}to{width:120px;height:120px;opacity:0;transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<div id="sky"><div id="sun"></div></div>
<div id="hint">✦ tap anywhere — stars chime ✦</div>
<div id="msg"></div>
<div id="ui">
<button id="bless">✨ Blessing</button>
<button id="dayBtn">☀️ Day</button>
<button id="ambBtn">🔔 Ambient: Off</button>
</div>
<script>
const sky=document.getElementById('sky'),msg=document.getElementById('msg');
let actx=null,ambientOn=false,ambientNodes=[];
const blessings=["You are loved beyond measure 🤍","Peace be with you 🕊️","Every cloud carries hope ☁️","Light finds you even in darkness ✨","Breathe in grace, breathe out worry 🌿","You are exactly where you need to be 💫","Hope is the dawn of the soul 🌅","Angels watch over you 👼"];
function tone(f,t=0.1,d=1.2){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.25,actx.currentTime+t+0.05);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+t+d);o.connect(g).connect(actx.destination);o.onended=()=>{try{o.disconnect();g.disconnect();}catch(e){}};o.start(actx.currentTime+t);o.stop(actx.currentTime+t+d+0.1);}catch(e){}}
const chime=()=>{[880,1174.7,1568].forEach((f,i)=>tone(f,i*0.09,1.4));};
// clouds
for(let i=0;i<6;i++){const c=document.createElement('div');c.className='cloud';const w=60+Math.random()*110;c.style.cssText=`width:${w}px;height:${w/3.2}px;top:${5+Math.random()*55}%;animation-duration:${50+Math.random()*50}s;animation-delay:-${Math.random()*60}s`;sky.appendChild(c);}
// stars (clickable)
for(let i=0;i<40;i++){const s=document.createElement('div');s.className='star';const sz=3+Math.random()*5;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*60}%;animation-delay:${(Math.random()*2.5).toFixed(1)}s`;s.onclick=e=>{e.stopPropagation();chime();s.classList.add('glow');burst(s);setTimeout(()=>s.classList.remove('glow'),900);};sky.appendChild(s);}
// floating orbs
function orb(){if(document.hidden)return;if(sky.querySelectorAll('.orb').length>30)return;const o=document.createElement('div');o.className='orb';const s=8+Math.random()*22;o.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${8+Math.random()*10}s`;sky.appendChild(o);setTimeout(()=>o.remove(),19000);}
setInterval(orb,900);for(let i=0;i<8;i++)orb();
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<8;i++){const p=document.createElement('div');p.className='orb';p.style.cssText=`left:${r.left}px;top:${r.top}px;width:8px;height:8px;animation:none;transition:all .9s ease-out`;sky.appendChild(p);void p.offsetWidth;requestAnimationFrame(()=>{p.style.transform=`translate(${(Math.random()-0.5)*160}px,${(Math.random()-0.5)*160}px)`;p.style.opacity='0';});setTimeout(()=>p.remove(),950);}}
function ripple(x,y){const r=document.createElement('div');r.className='ripple';r.style.left=x+'px';r.style.top=y+'px';sky.appendChild(r);setTimeout(()=>r.remove(),1000);}
function shootStar(){const s=document.createElement('div');s.className='shoot';s.style.left=(30+Math.random()*60)+'%';s.style.top=(5+Math.random()*25)+'%';sky.appendChild(s);setTimeout(()=>s.remove(),1500);}
function bless(){shootStar();chime();msg.textContent=blessings[Math.floor(Math.random()*blessings.length)];msg.classList.add('show');clearTimeout(bless._t);bless._t=setTimeout(()=>msg.classList.remove('show'),3500);}
document.getElementById('bless').onclick=e=>{e.stopPropagation();bless();};
document.getElementById('dayBtn').onclick=e=>{e.stopPropagation();sky.classList.toggle('day');e.target.textContent=sky.classList.contains('day')?'🌙 Night':'☀️ Day';tone(660,0,0.8);};
document.getElementById('ambBtn').onclick=e=>{e.stopPropagation();ambientOn=!ambientOn;e.target.textContent=ambientOn?'🔔 Ambient: On':'🔔 Ambient: Off';if(ambientOn)startAmbient();else stopAmbient();};
function startAmbient(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();if(ambientNodes.length)return;[261.6,329.6,392].forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=0.03;o.connect(g).connect(actx.destination);o.start();ambientNodes.push({o,g});});}catch(e){}}
function stopAmbient(){ambientNodes.forEach(n=>{try{n.o.stop();}catch(e){}try{n.o.disconnect();n.g.disconnect();}catch(e){}});ambientNodes=[];}
sky.addEventListener('pointerdown',e=>{ripple(e.clientX,e.clientY);tone(500+Math.random()*700,0,0.9);if(Math.random()<0.25)shootStar();});
</script>
</body>
</html>
